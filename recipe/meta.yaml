{% set version = "0.0.9" %}

package:
  name: pyncml
  version: {{ version }}

source:
  fn: pyncml-{{ version }}.tar.gz
  url: https://pypi.org/packages/source/p/pyncml/pyncml-{{ version }}.tar.gz
  sha256: f0df2ab0644e0f0923794db74cd55a23999f8c2889153bcdcd96ca27aeff4fac

build:
  noarch: python
  number: 2
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - pip
    - python {{ python_min }}
    - setuptools
    - netcdf4
    - pytz
  run:
    - python >={{ python_min }}
    - numpy
    - netcdf4
    - pytz

test:
  requires:
    - python {{ python_min }}
  imports:
    - pyncml

about:
  home: https://github.com/axiom-data-science/pyncml
  license: MIT
  license_file: LICENSE.txt
  summary: 'A simple python library to apply NcML logic to NetCDF files.'

extra:
  recipe-maintainers:
    - kwilcox
    - ocefpaf
